<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <title>تسجيل دخول - محول جهات الاتصال</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f9f9f9;
      margin: 0;
      padding: 0;
      text-align: center;
      direction: rtl;
    }
    header {
      background-color: #004080;
      color: white;
      padding: 0;
    }
    header img {
      width: 100%;
      max-height: 180px;
      object-fit: cover;
    }
    .container {
      max-width: 700px;
      margin: 30px auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    input, button, label {
      display: block;
      margin: 10px auto;
      padding: 12px;
      font-size: 16px;
      width: 90%;
      max-width: 400px;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #0056b3;
    }
    .logout-btn {
      background-color: #dc3545;
      margin-top: 15px;
    }
    .hidden { display: none; }
    .field-options {
      margin-top: 20px;
      text-align: right;
    }
    .field-options label {
      display: block;
      margin: 5px 0;
      font-size: 15px;
    }
    .select-toggle {
      margin: 10px 0;
      cursor: pointer;
      color: #007bff;
    }
    .user-info {
      font-weight: bold;
      margin-bottom: 15px;
      color: #004080;
      font-size: 18px;
    }
    #activityLog {
      margin-top: 20px;
      background: #f1f1f1;
      padding: 10px;
      border-radius: 5px;
      text-align: right;
      max-height: 200px;
      overflow-y: auto;
      font-size: 14px;
    }
    #activityLog h4 {
      margin-top: 0;
    }
  </style>
</head>
<body>

  <header>
    <img src="banar.png" alt="بانر الموقع">
  </header>

  <!-- واجهة تسجيل الدخول -->
  <div class="container" id="loginSection">
    <h2>تسجيل الدخول</h2>
    <input type="text" id="username" placeholder="اسم المستخدم" />
    <input type="password" id="password" placeholder="كلمة المرور" />
    <button onclick="login()">دخول</button>
    <p id="loginMessage" style="color:red;"></p>
  </div>

  <!-- الواجهة الرئيسية بعد الدخول -->
  <div class="container hidden" id="mainSection">
    <div class="user-info" id="loggedInUser"></div>
    <button class="logout-btn" onclick="logout()">تسجيل الخروج</button>
    <h2>محول Excel إلى VCF</h2>
    <input type="file" id="excelFile" accept=".xlsx, .xls" />

    <div class="field-options">
      <strong>اختر الأعمدة التي تريد تضمينها:</strong>
      <span class="select-toggle" onclick="toggleAllFields()">تحديد الكل / إلغاء الكل</span>
      <label><input type="checkbox" class="fieldCheck" id="fieldPhone1" checked> رقم الهاتف (أساسي)</label>
      <label><input type="checkbox" class="fieldCheck" id="fieldPhone2"> رقم هاتف ثاني</label>
      <label><input type="checkbox" class="fieldCheck" id="fieldPhone3"> رقم هاتف ثالث</label>
      <label><input type="checkbox" class="fieldCheck" id="fieldEmail"> بريد إلكتروني</label>
      <label><input type="checkbox" class="fieldCheck" id="fieldAddress"> عنوان</label>
      <label><input type="checkbox" class="fieldCheck" id="fieldNotes"> ملاحظات</label>
    </div>

    <button onclick="convertToVCF()">تحويل وتحميل</button>
    <button onclick="downloadTemplate()">تحميل نموذج Excel فارغ</button>
    <br />
    <a id="downloadLink" style="display:none;">⬇️ تحميل ملف VCF</a>

    <div id="activityLog">
      <h4>سجل النشاطات</h4>
      <ul id="logList"></ul>
    </div>
  </div>

  <!-- مكتبات -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <script>
    let currentUsername = "";

    function logActivity(message) {
      const time = new Date().toLocaleTimeString();
      const li = document.createElement("li");
      li.textContent = `[${time}] ${message}`;
      document.getElementById("logList").prepend(li);
    }

    function login() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      fetch("users.json")
        .then(res => res.json())
        .then(users => {
          const user = users.find(u => u.name === username && u.password === password);

          if (user) {
            const today = new Date();
            const startDate = new Date(user.subscription_start_date);
            const endDate = new Date(user.subscription_end_date);

            if (today >= startDate && today <= endDate) {
              currentUsername = user.name;
              document.getElementById("loginSection").classList.add("hidden");
              document.getElementById("mainSection").classList.remove("hidden");
              document.getElementById("loggedInUser").textContent = `مرحباً، ${currentUsername}`;
              logActivity(`تم تسجيل الدخول بواسطة ${currentUsername}`);
            } else {
              document.getElementById("loginMessage").textContent =
                "تم انتهاء فترة الاشتراك ويمكنك تجديد الاشتراك من خلال التواصل معنا على الرقم 01205557825";
            }
          } else {
            document.getElementById("loginMessage").textContent = "اسم المستخدم أو كلمة المرور غير صحيحة.";
          }
        })
        .catch(error => {
          console.error('Error loading users:', error);
          document.getElementById("loginMessage").textContent = "حدث خطأ في تحميل بيانات المستخدمين.";
        });
    }

    function logout() {
      logActivity(`تم تسجيل الخروج بواسطة ${currentUsername}`);
      currentUsername = "";
      document.getElementById("mainSection").classList.add("hidden");
      document.getElementById("loginSection").classList.remove("hidden");
      document.getElementById("username").value = "";
      document.getElementById("password").value = "";
      document.getElementById("loginMessage").textContent = "";
    }

    function getFormattedDate() {
      const now = new Date();
      return `${now.getFullYear()}-${(now.getMonth()+1).toString().padStart(2,'0')}-${now.getDate()}_${now.getHours()}-${now.getMinutes()}`;
    }

    function toggleAllFields() {
      const checks = document.querySelectorAll('.fieldCheck');
      const allChecked = Array.from(checks).every(cb => cb.checked);
      checks.forEach(cb => cb.checked = !allChecked);
    }

    function convertToVCF() {
      const file = document.getElementById('excelFile').files[0];
      if (!file) return alert("اختر ملف Excel أولاً.");

      const include = id => document.getElementById(id).checked;

      const reader = new FileReader();
      reader.onload = function (e) {
        const workbook = XLSX.read(e.target.result, { type: 'array' });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const data = XLSX.utils.sheet_to_json(sheet);

        let vcf = "";
        data.forEach(row => {
          const name = row["الاسم"] || "";
          if (!name) return;
          let vcard = "BEGIN:VCARD\nVERSION:3.0\n";
          vcard += `FN:${name}\n`;
          if (include("fieldPhone1") && row["رقم الهاتف"]) vcard += `TEL;TYPE=CELL:${row["رقم الهاتف"]}\n`;
          if (include("fieldPhone2") && row["رقم هاتف ثاني"]) vcard += `TEL;TYPE=CELL:${row["رقم هاتف ثاني"]}\n`;
          if (include("fieldPhone3") && row["رقم هاتف ثالث"]) vcard += `TEL;TYPE=CELL:${row["رقم هاتف ثالث"]}\n`;
          if (include("fieldEmail") && row["بريد الكتروني"]) vcard += `EMAIL:${row["بريد الكتروني"]}\n`;
          if (include("fieldAddress") && row["عنوان"]) vcard += `ADR:${row["عنوان"]}\n`;
          if (include("fieldNotes") && row["ملاحظات"]) vcard += `NOTE:${row["ملاحظات"]}\n`;
          vcard += "END:VCARD\n";
          vcf += vcard;
        });

        const blob = new Blob([vcf], { type: 'text/vcard' });
        const url = URL.createObjectURL(blob);
        const filename = `contacts_${getFormattedDate()}.vcf`;
        const link = document.getElementById("downloadLink");
        link.href = url;
        link.download = filename;
        link.style.display = "inline-block";
        link.textContent = `⬇️ تحميل ملف ${filename}`;

        logActivity(`تم تحويل ملف Excel (${file.name}) إلى VCF باسم ${filename}`);
      };
      reader.readAsArrayBuffer(file);
    }

    function downloadTemplate() {
      const ws = XLSX.utils.aoa_to_sheet([
        ["الاسم", "رقم الهاتف", "رقم هاتف ثاني", "رقم هاتف ثالث", "بريد الكتروني", "عنوان", "ملاحظات"]
      ]);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Template");
      XLSX.writeFile(wb, "excel_template.xlsx");
      logActivity("تم تحميل نموذج Excel الفارغ.");
    }
  </script>
</body>
</html>
